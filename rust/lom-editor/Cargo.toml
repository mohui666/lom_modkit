[package]
name = "lom-editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lom-editor"
path = "src/main.rs"

[dependencies]
lom-core.workspace = true
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
regex.workspace = true
tempfile.workspace = true
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAccessibility", "NSAppearance", "NSColor", "NSGlassEffectView", "NSGraphics", "NSResponder", "NSUserInterfaceItemIdentification", "NSView", "NSVisualEffectView", "NSWindow", "NSWorkspace", "objc2-core-foundation"] }
