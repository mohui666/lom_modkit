name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    name: Compiler tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: compiler/requirements-detector.txt

      - name: Install test dependencies
        run: python -m pip install -r compiler/requirements-detector.txt

      - name: Run Compiler tests
        working-directory: compiler
        run: python -m unittest discover -s tests -p "test_*.py" -v

  runtime:
    name: Runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Run Runtime offline tests
        run: >-
          dotnet run
          --project runtime/MortalModHost/test/SmokeTest/SmokeTest.csproj
          --configuration Release
