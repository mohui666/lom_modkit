name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Native Rust tools (macOS)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Verify Rust toolchain
        run: rustup show
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Test native compiler and editor
        run: cargo test --locked --workspace
      - name: Verify embedded authoring data and previews
        run: cargo run --locked -p lom-editor -- --smoke-preview samples/showcase3

      - name: Rebuild acceptance sample with Rust
        run: cargo run --locked -p lomc --example build_showcase3 -- out/showcase3-native

  runtime:
    name: Runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Run Runtime offline tests
        run: >-
          dotnet run
          --project runtime/MortalModHost/test/SmokeTest/SmokeTest.csproj
          --configuration Release
