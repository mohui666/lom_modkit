name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    name: Compiler tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: compiler/requirements-detector.txt

      - name: Install test dependencies
        run: python -m pip install -r compiler/requirements-detector.txt

      - name: Run Compiler tests
        working-directory: compiler
        run: python -m unittest discover -s tests -p "test_*.py" -v

  editor:
    name: Editor tests
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: editor/requirements-ci.txt

      - name: Install test dependencies
        run: python -m pip install -r editor/requirements-ci.txt

      - name: Run Editor unit tests
        working-directory: editor
        run: python -m unittest discover -s tests -p "*_test.py" -v

      - name: Run Editor smoke test
        working-directory: editor
        run: python tests/smoke_test.py

      - name: Run Editor stress test
        working-directory: editor
        run: python tests/stress_test.py

  runtime:
    name: Runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Run Runtime offline tests
        run: >-
          dotnet run
          --project runtime/MortalModHost/test/SmokeTest/SmokeTest.csproj
          --configuration Release
